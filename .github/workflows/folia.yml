name: Folia and web build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: mvn -B -f folia/pom.xml clean package
      - run: java -ea -cp folia/target/classes:folia/target/test-classes jp.kcraft.piano.NoteTrailCheck
      - run: python scripts/build_pack.py
      - run: python scripts/check_model_alignment.py
      - run: npm ci && npm run build && npm test
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: kcraft-piano-folia
          path: |
            folia/target/kcraft-piano-folia-*.jar
            web/public/downloads/kcraft-piano-pack.zip
